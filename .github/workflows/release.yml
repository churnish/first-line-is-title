name: Release

on:
  push:
    tags:
      - "*"
      - "!v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No push back to main here: this tag is cut from the 3.10.3 line, not from
      # main's tip, so `git push origin HEAD:main` would be a non-fast-forward and
      # would abort the job before the release is published.

      - name: Create release bundle
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/
          cd release
          zip ../first-line-is-title.zip main.js manifest.json styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            first-line-is-title.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
