name: Feature request
description: Suggest an improvement or new feature for the First Line is Title plugin
labels:
  - Feature request
body:
  - type: markdown
    attributes:
      value: '**Note:** If English is not your first language, please consider using AI tools like ChatGPT to translate your responses.'
  - type: checkboxes
    id: checklist
    attributes:
      label: Enhancement checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have updated to the latest version of First Line is Title
          required: true
        - label: I have updated to the latest version of Obsidian
          required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case or problem
      description: What's your use case for this feature? In other words, what are you trying to accomplish when you realize you need this feature?
      placeholder: Describe use case or problem here...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: The meat of the feature request. How do you think we should implement this feature and how would this solve your problem?
      placeholder: Describe solution here...
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (optional)
      description: If you're using any workarounds, it might be helpful to us to get some inspiration.
      placeholder: Describe workaround here...
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional information (optional)
      description: Provide any additional information that you think would be helpful to understand your suggestion.
      placeholder: Add additional information here...
    validations:
      required: false
  - type: textarea
    id: debug-info
    attributes:
      label: Debug information (optional)
      description: |-
        To share your Obsidian debug info:

        1. Open Command palette.
        2. Search for then select "Show debug info".
        3. Press "Copy to clipboard".
        4. Paste the copied text here.
      placeholder: Paste debug info here...
      render: text
    validations:
      required: false
  - type: textarea
    id: console-logs
    attributes:
      label: Console logs (optional)
      description: |-
        To share console logs:

        1. Open developer tools in Obsidian (`Ctrl+Shift+I` on Windows/Linux, `Cmd+Option+I` on macOS).
        2. Open the **Console** tab.
        3. Reproduce the bug.
        4. Share any console output that appears below.

        **Note:** Console logs can contain file paths, note titles, and other vault details. Please review before sharing.
      placeholder: Add console logs here...
    validations:
      required: false
  - type: textarea
    id: plugin-settings
    attributes:
      label: Plugin settings (optional)
      description: |-
        To share your plugin settings:

        1. Open the vault folder in the system file manager.
        2. Open your Obsidian configuration folder (`.obsidian` by default, hidden on most OSes).
        3. Open `plugins/first-line-is-title`.
        4. Attach the `data.json` file below.
      placeholder: Attach data.json here...
    validations:
      required: false
